[project]
name = "kaggle-titanic"
version = "0.1.0"
description = "Kaggle Titanic: survival prediction with gradient boosting (learning project)"
readme = "README.md"
authors = [
    { name = "William Woodhead" }
]
requires-python = ">=3.9"
dependencies = [
    "jupyter>=1.1.1",
    "kaggle>=1.7.4.5",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
]

[project.scripts]
kaggle-titanic = "kaggle_titanic:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
